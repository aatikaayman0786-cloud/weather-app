<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
</head>
<body>

<div class="container">
    <h1>Weather App</h1>
    <p>Enter a city name to get current weather</p>

    <form method="POST">
        <input
            type="text"
            name="city"
            placeholder="Enter city name"
            value="{{ city }}"
            required
        >
        <button type="submit">Get Weather</button>
    </form>

    {% if weather %}
        <div class="result">
            <h2>Weather Result</h2>
            <p>{{ weather }}</p>
        </div>
    {% endif %}
</div>

</body>
</html>
